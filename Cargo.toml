[package]
name = "ds18b20"
version = "0.1.1"
authors = ["Nathan Fox <fuchsnj@gmail.com>"]
edition = "2018"
license = "MIT/Apache-2.0"
repository = "https://github.com/DaneSlattery/ds18b20"
keywords = [
    "onewire",
    "embedded-hal-driver",
    "ds18b20",
    "temperature",
    "sensor",
]
readme = "README.md"
categories = ["embedded", "hardware-support", "no-std"]
description = """
A Rust DS18B20 temperature sensor driver for [embedded-hal](https://github.com/rust-embedded/embedded-hal)
"""

[features]
async = ["dep:embedded-hal-async", "one-wire-bus/async"]
std = []
default = ["async"]

[dependencies]
embedded-hal = "1.0.0"
embedded-hal-async = { version = "1.0.0", optional = true }
one-wire-bus = { version = "0.2.0", git = "https://github.com/DaneSlattery/one-wire-bus", branch = "embedded-hal-async" }
